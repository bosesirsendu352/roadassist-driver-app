plugins { id 'com.android.application' }

android {
    namespace 'com.roadassist.driver'
    compileSdk 33
    defaultConfig {
        applicationId "com.roadassist.driver"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "1.1"
        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
        // CRM address the app talks to (driver can change it on the pairing screen)
        buildConfigField "String", "CRM_URL", '"https://roadassist-crm.bosesirsendu355.workers.dev"'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // test build: signed with the debug key so it installs directly
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }
}

dependencies {
    // Yeastar Linkus SDK for Android (MIT) + its database dependency, from github.com/Yeastar-PBX/linkus-android-sdk
    implementation files('libs/linkus-sdk-1.2.12.aar')
    implementation files('libs/wcdb-room.aar')
    implementation 'com.tencent.wcdb:wcdb-android:1.0.8'
    implementation 'androidx.room:room-runtime:2.3.0'
    implementation 'androidx.media:media:1.0.0'
    implementation 'androidx.annotation:annotation:1.3.0'
}
