plugins { id 'com.android.application' }

android {
    namespace 'com.roadassist.driver'
    compileSdk 33
    defaultConfig {
        applicationId "com.roadassist.driver"
        minSdk 26
        targetSdk 33
        versionCode 3
        versionName "2.0"
        // CRM address the app talks to (driver can change it on the pairing screen)
        buildConfigField "String", "CRM_URL", '"https://roadassist-crm.bosesirsendu355.workers.dev"'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // test build: signed with the debug key so it installs directly
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.3.0'
}
