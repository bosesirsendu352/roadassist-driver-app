name: Build driver APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RoadAssistDriver-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish APK as a download (Releases → latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk RoadAssistDriver.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RoadAssistDriver.apk --title "RoadAssist Driver (latest build)" --notes "Install on the driver's Android phone. Build ${{ github.run_number }}." --latest
